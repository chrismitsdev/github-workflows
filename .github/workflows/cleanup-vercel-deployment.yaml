name: Cleanup stale Vercel deployments

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions: {}

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete deployments whose Renovate branch is gone
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN }} # contents:read on all target repos
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          vercel() { curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          gh_status() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$1"
          }

          rows=$(mktemp)
          until=""
          for _ in $(seq 1 20); do
            args=(--get --data-urlencode limit=100 --data-urlencode "teamId=$VERCEL_TEAM_ID")
            [ -n "$until" ] && args+=(--data-urlencode "until=$until")
            page=$(vercel "${args[@]}" https://api.vercel.com/v7/deployments)

            jq -r '
              .deployments[]
              | select((.meta.githubCommitRef // "") | startswith("renovate/"))
              | select(.meta.githubOrg and .meta.githubRepo)
              | [.meta.githubOrg, .meta.githubRepo, .meta.githubCommitRef, .uid]
              | @tsv' <<<"$page" >> "$rows"

            until=$(jq -r '.pagination.next // empty' <<<"$page")
            [ -z "$until" ] && break
          done

          cut -f1-3 "$rows" | sort -u | while IFS=$'\t' read -r owner repo branch; do
            repo_status=$(gh_status "https://api.github.com/repos/$owner/$repo")
            if [ "$repo_status" != 200 ]; then
              echo "SKIP $owner/$repo (repo HTTP $repo_status)"; continue
            fi

            status=$(gh_status "https://api.github.com/repos/$owner/$repo/branches/$branch")
            if [ "$status" != 404 ]; then
              echo "KEEP $owner/$repo@$branch (HTTP $status)"; continue
            fi

            awk -F'\t' -v o="$owner" -v r="$repo" -v b="$branch" \
              '$1==o && $2==r && $3==b {print $4}' "$rows" |
            while read -r id; do
              if [ "$DRY_RUN" = true ]; then
                echo "DRY-RUN delete $id ($owner/$repo@$branch)"
              elif vercel -X DELETE "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_TEAM_ID" >/dev/null; then
                echo "DELETED $id ($owner/$repo@$branch)"
              else
                echo "FAILED  $id"
              fi
            done
          done
