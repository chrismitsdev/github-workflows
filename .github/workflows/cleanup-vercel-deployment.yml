name: Inspect Vercel deployments

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect Renovate deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --get \
            --url "https://api.vercel.com/v6/deployments" \
            --data-urlencode "limit=100" \
            --header "Authorization: Bearer $VERCEL_TOKEN" |
          jq -r '
            .deployments[]
            | select(.meta.githubCommitRef // "" | startswith("renovate/"))
            | {
                uid,
                url,
                created,
                state,
                meta
              }
          '
